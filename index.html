<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Another To Do</title>

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/global.css" />
  </head>

  <body>
    <main>
      <div class="header-row">
        <h1 class="today"></h1>
        <div class="sync-controls" id="sync-controls"></div>
      </div>
      <div class="items" role="list">
        <div class="top-actions">
          <a href="#" class="btn action-btn add-btn" title="Add new task">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="10" y1="4" x2="10" y2="16"></line>
              <line x1="4" y1="10" x2="16" y2="10"></line>
            </svg>
          </a>
        </div>
      </div>
      <small><a href="#" class="filter-toggle">show completed items</a></small><br/>
      <small class="count"></small>

      <footer>
        <div id="sync-status-footer"></div>
        <div id="footer-info"></div>
      </footer>

      <div id="form-container" role="dialog" style="display: none;">
        <div class="modal-content">
          <span role="button" class="close" tabindex="0">&times;</span>
          <form id="task-form">
            <textarea id="task-input" placeholder="buy milk"></textarea>
            <a href="#" class="btn action-btn save-btn" title="Save task">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20,6 9,17 4,12"></polyline>
              </svg>
            </a>
          </form>
        </div>
      </div>

      <div id="settings-modal" role="dialog" style="display: none;">
        <div class="modal-content settings-modal-content">
          <span role="button" class="close close-settings" tabindex="0">&times;</span>
          <h2>Settings</h2>
          <form id="settings-form">
            <div class="settings-grid">
              <div class="settings-group">
                <h3 class="settings-group-title">Appearance</h3>
                <div class="settings-row">
                  <label class="settings-row-label">Theme</label>
                  <div class="theme-selector">
                    <button type="button" class="theme-option" data-theme="light">
                      <span class="theme-option-icon">☀️</span>
                      <span class="theme-option-label">Light</span>
                    </button>
                    <button type="button" class="theme-option" data-theme="dark">
                      <span class="theme-option-icon">🌙</span>
                      <span class="theme-option-label">Dark</span>
                    </button>
                  </div>
                </div>
              </div>

              <div class="settings-group">
                <h3 class="settings-group-title">Cloud Sync</h3>
                <div class="settings-row">
                  <label for="dexie-cloud-url" class="settings-row-label">Database URL</label>
                  <div class="settings-row-input">
                    <input
                      type="text"
                      id="dexie-cloud-url"
                      placeholder="https://YOUR_DB_ID.dexie.cloud"
                      autocomplete="off"
                    />
                    <small class="help-text">
                      Leave empty for local-only mode. <a href="https://dexie.cloud" target="_blank">Get a free database</a>
                    </small>
                  </div>
                </div>
              </div>
            </div>

            <div class="settings-actions">
              <button type="button" class="btn-secondary" id="cancel-settings">Cancel</button>
              <button type="submit" class="btn-primary">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
