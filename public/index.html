<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Another To Do</title>

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./global.css" />
  </head>

  <body>
    <main>
      <div class="header-row">
        <h1 class="today"></h1>
        <div class="sync-controls" id="sync-controls"></div>
      </div>
      <div class="items" role="list">
        <div class="top-actions">
          <a href="#" class="btn action-btn add-btn">&oplus;</a>
        </div>
      </div>
      <small><a href="#" class="filter-toggle">show completed items</a></small><br/>
      <small class="count"></small>

      <div id="form-container" role="dialog" style="display: none;">
        <div class="modal-content">
          <span role="button" class="close" tabindex="0">&times;</span>
          <form id="task-form">
            <textarea id="task-input" placeholder="buy milk"></textarea>
            <a href="#" class="btn action-btn save-btn">&darr;</a>
          </form>
        </div>
      </div>

      <div id="settings-modal" role="dialog" style="display: none;">
        <div class="modal-content settings-modal-content">
          <span role="button" class="close close-settings" tabindex="0">&times;</span>
          <h2>Cloud Sync Settings</h2>
          <form id="settings-form">
            <div class="settings-section">
              <label for="dexie-cloud-url">Dexie Cloud Database URL</label>
              <input
                type="text"
                id="dexie-cloud-url"
                placeholder="https://YOUR_DB_ID.dexie.cloud"
                autocomplete="off"
              />
              <small class="help-text">
                Leave empty to use local-only mode.<br/>
                To enable sync: <a href="https://dexie.cloud" target="_blank">Create a free Dexie Cloud database</a>
              </small>
            </div>
            <div class="settings-actions">
              <button type="submit" class="btn-primary">Save</button>
              <button type="button" class="btn-secondary" id="cancel-settings">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script type="module" src="./build/bundle.js"></script>
  </body>
</html>
